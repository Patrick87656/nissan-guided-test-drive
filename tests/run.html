<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nissan Guided Test Drive tests</title>
  <!--
    Headless test page. Run it with tests/run-tests.ps1 (or open it in a
    browser). It loads the app modules that don't need Mapbox and never calls
    KPR.app.init(), so no map, token or network is involved.
  -->
</head>
<body>
  <pre id="results">Running…</pre>

  <!-- DOM skeleton: just the element ids that list/render code looks up. -->
  <div id="fixture-dom" hidden>
    <input id="route-name" value="">
    <button id="clear-waypoints">Clear</button>

    <div id="route-status" class="status-box"></div>
    <span id="stat-stops"></span>
    <ol id="waypoint-list"></ol>
    <span id="waypoint-count"></span>
    <p id="itinerary-empty"></p>
    <h2>Scene legend</h2>
    <ul id="scene-legend"></ul>
    <ul id="scene-list"></ul>
    <span id="scene-count"></span>
    <p id="scenes-empty"></p>

    <!-- Voice option and print card, same ids as index.html. -->
    <input id="speak-notes" type="checkbox" checked>
    <div id="print-card"></div>

    <!-- Share button and dialog, same ids/structure as index.html. -->
    <button id="share-route" aria-disabled="true" title="">Share</button>
    <div id="share-dialog" class="hidden">
      <div class="dialog-box share-box">
        <div id="share-qr-wrap"><canvas id="share-qr" width="1" height="1"></canvas></div>
        <p id="share-qr-fallback" class="hidden"></p>
        <label for="share-link">Link <input id="share-link" type="text" readonly></label>
        <p id="share-long-hint" class="hidden"></p>
        <p id="share-status" role="status"></p>
        <button id="share-print" type="button">Print route card</button>
        <button id="share-close" type="button">Close</button>
        <button id="share-send" type="button" class="hidden">Send</button>
        <button id="share-copy" type="button">Copy link</button>
      </div>
    </div>

    <!-- Open a shared link: entry button and dialog, same ids as index.html. -->
    <button id="open-link-btn" type="button">Open a shared link</button>
    <div id="open-link-dialog" class="dialog hidden">
      <div class="dialog-box">
        <textarea id="open-link-input" rows="3"></textarea>
        <p id="open-link-msg" class="hidden" role="alert"></p>
        <button id="open-link-close" type="button">Cancel</button>
        <button id="open-link-paste" type="button">Paste</button>
        <button id="open-link-go" type="button">Open</button>
      </div>
    </div>

    <!-- Pre-drive location backstop dialog, same ids/classes as index.html. -->
    <div id="geo-dialog" class="dialog hidden">
      <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="geo-dialog-title">
        <h3 id="geo-dialog-title">Turn on location for this drive</h3>
        <p id="geo-dialog-body" class="hint"></p>
        <div class="button-row">
          <button id="geo-dialog-dismiss" class="secondary-btn" type="button">Not now</button>
          <button id="geo-dialog-allow" class="primary-btn" type="button">Allow</button>
        </div>
      </div>
    </div>

    <!-- Footer strip for the "Enable location" tests, same ids/classes as
         index.html's #panel-footer: the strip (button + help region) above a
         #start-drive stub. -->
    <footer id="panel-footer">
      <div id="enable-location" class="enable-location hidden">
        <button id="enable-location-btn" class="enable-location-btn" type="button">
          <span id="enable-location-label">Enable location</span>
        </button>
        <div id="enable-location-help" class="enable-location-help hidden" role="region" aria-live="polite"></div>
      </div>
      <button id="start-drive" class="drive-btn" type="button">Start drive</button>
    </footer>
  </div>

  <script src="harness.js"></script>
  <!-- Mapbox-free; map.js/drive.js stay out of the harness (they need Mapbox). -->
  <script src="../js/geo-permission.js"></script>
  <!-- map.js only touches mapboxgl inside its functions, so it can load here
       for the pure probeSatellite() tests; init() is never called. -->
  <script src="../js/map.js"></script>
  <script src="../js/waypoints.js"></script>
  <script src="../js/scenes.js"></script>
  <script src="../js/vendor/qrcodegen-v1.8.0-es5.js"></script>
  <script src="../js/route-codec.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/share.js"></script>
  <script src="../js/open-link.js"></script>
  <script src="../js/voice-prefs.js"></script>
  <script src="../js/print-card.js"></script>
  <script src="../js/geo-dialog.js"></script>
  <script src="../js/enable-location-strip.js"></script>
  <script src="../js/app.js"></script>
  <script src="fixtures/route-fixtures.js"></script>
  <script src="scenes-coords.test.js"></script>
  <script src="storage.test.js"></script>
  <script src="render-audit.test.js"></script>
  <script src="codec.test.js"></script>
  <script src="share-ui.test.js"></script>
  <script src="open-link.test.js"></script>
  <script src="dealer-extras.test.js"></script>
  <script src="geo-permission.test.js"></script>
  <script src="enable-location.test.js"></script>
</body>
</html>
